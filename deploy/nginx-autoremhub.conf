# AUTOREMHUB 0.38.1 — пример сайта Nginx: Front и API на одном домене.
# Замените <ваш-домен>, пути к сертификату и /var/www/autoremhub на свои.
# PHP-FPM 8.4: сокет по умолчанию в Ubuntu/Debian — /run/php/php8.4-fpm.sock.

server {
    listen 80;
    server_name <ваш-домен>;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name <ваш-домен>;

    ssl_certificate     /etc/letsencrypt/live/<ваш-домен>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/<ваш-домен>/privkey.pem;

    # Вложения заявок до 100 МБ (StoreAttachmentRequest max:102400).
    client_max_body_size 110m;

    # Front: собранный Vue из front/dist.
    root /var/www/autoremhub/front/dist;
    index index.html;

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # API: все запросы /api/... обрабатывает Laravel из api/public.
    location ^~ /api/ {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/autoremhub/api/public/index.php;
        fastcgi_param DOCUMENT_ROOT   /var/www/autoremhub/api/public;
        fastcgi_param HTTPS on;
        fastcgi_read_timeout 300;
    }

    location ~ /\. {
        deny all;
    }
}
